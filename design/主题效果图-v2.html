<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>墨语 · 双色主题 + 右下角小形象</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#EDEDF0;
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    padding:38px 44px 34px;
    -webkit-font-smoothing:antialiased;
  }
  .hd { margin-bottom:26px; }
  .hd h1 { font-size:25px; font-weight:600; color:#1C1C1E; letter-spacing:-.2px; }
  .hd p  { font-size:13.5px; color:#75757C; margin-top:7px; line-height:1.62; }
  .hd p b { color:#3A3A40; font-weight:600; }
  .grid { display:flex; flex-wrap:wrap; gap:34px 34px; }

  .card { width:468px; }
  .card .lab { display:flex; align-items:baseline; gap:9px; margin-bottom:10px; }
  .card .lab b { font-size:15.5px; font-weight:600; color:#1C1C1E; }
  .card .lab span { font-size:12px; color:#8A8A90; }
  .card .sw { margin-left:auto; display:flex; gap:5px; }
  .card .sw i { width:16px; height:16px; border-radius:5px; display:block; }

  /* ---------- 键盘 ---------- */
  .kb {
    width:468px; height:309.6px;
    border-radius:13px; overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow:0 13px 27px rgba(0,0,0,.11), 0 2px 6px rgba(0,0,0,.06);
    position:relative;
  }
  .cand {
    height:52.8px; flex:none; display:flex; align-items:center;
    padding:0 12px; gap:16px; position:relative;
  }
  .cand .ch { font-size:21px; font-weight:500; letter-spacing:.4px; }
  .cand .c1 { font-size:18.5px; font-weight:600; padding:3px 10px; border-radius:7px; }
  .cand .cn { font-size:16.5px; }

  .aibar { height:48px; flex:none; display:flex; align-items:center; padding:0 12px; gap:9px; }
  .pill { font-size:12.5px; padding:5px 11px; border-radius:13px; display:flex; align-items:center; gap:5px; white-space:nowrap; }
  .knob {
    margin-left:auto; width:40.8px; height:40.8px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex:none;
  }

  .keys { flex:1; padding:0 4.8px; display:flex; flex-direction:column; justify-content:space-between; }
  .row { display:flex; gap:7.2px; }
  .k {
    flex:1; border-radius:7px; display:flex; align-items:center; justify-content:center;
    font-size:19.5px; font-weight:400;
  }
  .k.fn { font-size:13.5px; }
  /* 最后一行的角落格：留给小形象 */
  .corner {
    flex:0 0 30px; border-radius:7px;
    display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:1px;
  }
  .corner svg { display:block; }

  /* ---------- 档位 / 符号一览 ---------- */
  .sect { margin-top:44px; }
  .sect h2 { font-size:18px; font-weight:600; color:#1C1C1E; margin-bottom:5px; }
  .sect .sub { font-size:13px; color:#75757C; margin-bottom:18px; line-height:1.6; }
  .trow { display:flex; gap:22px; flex-wrap:wrap; }
  .tbox {
    background:#fff; border-radius:12px; padding:15px 17px 14px; width:236px;
    box-shadow:0 2px 9px rgba(0,0,0,.06);
  }
  .tbox .tname { font-size:13.5px; font-weight:600; color:#1C1C1E; margin-bottom:4px; }
  .tbox .tdesc { font-size:11.5px; color:#8A8A90; line-height:1.62; margin-bottom:13px; height:56px; }
  .tbox .tdemo { display:flex; align-items:center; gap:15px; }
  .tbox .tdemo .box {
    width:54px; height:54px; border-radius:10px; background:#F5F5F8;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .tbox .tdemo .sz { font-size:11px; color:#9A9AA0; line-height:1.85; }
  .symrow { display:flex; gap:14px; flex-wrap:wrap; }
  .sym {
    background:#fff; border-radius:10px; padding:11px 14px;
    box-shadow:0 2px 9px rgba(0,0,0,.06);
    display:flex; align-items:center; gap:10px;
  }
  .sym .lbl { font-size:11.5px; color:#6A6A72; }
</style>
</head>
<body>

<div class="hd">
  <h1>墨语 · 双色主题 + 右下角小形象（v3）</h1>
  <p>每套 = 一个 AI 品牌主色 + 一个中性底色。<b>全键盘只有 4 处出现主色</b>（首选字底、AI 胶囊、对话旋钮、回车键），其余全是浅底白键。<br>
     右下角小形象单独占一格（<b>不再压住回车键</b>），尺寸 22pt —— 这是唯一既看得见、又不踩版权线的规格。</p>
</div>

<div class="grid" id="grid"></div>

<div class="sect">
  <h2>右下角小形象 · 三档精细度</h2>
  <div class="sub">同一个位置、同一套配色，只是画到什么程度。在 22pt 的格子里这三档识别率差别不大，但版权风险差很多 —— <b>A 零风险，C 需要原创绘制</b>。</div>
  <div class="trow" id="tiers"></div>
</div>

<div class="sect">
  <h2>可选符号 · 八选一</h2>
  <div class="sub">全部是几何图形，公共领域，可自由商用。</div>
  <div class="symrow" id="syms"></div>
</div>

<script>
// 六套主题：主色 / 浅底 / 键面 / 功能键 / 副文字
const THEMES = [
  { id:'ink',    name:'墨黑', brand:'ChatGPT 系',  accent:'#101010', tint:'#F7F7F5', tint2:'#EBEBEA', sub:'#3A3A3E', canvas:'#D7D7DC', deep:'#101010' },
  { id:'coral',  name:'珊瑚', brand:'Claude 系',   accent:'#D97757', tint:'#FDF3EE', tint2:'#F5E2D9', sub:'#6B4A3E', canvas:'#DFD6D1', deep:'#8A4B33' },
  { id:'indigo', name:'靛蓝', brand:'DeepSeek 系', accent:'#4D6BFE', tint:'#EEF1FF', tint2:'#E0E5FC', sub:'#3A4570', canvas:'#D3D8EC', deep:'#2B3B9E' },
  { id:'violet', name:'星紫', brand:'Gemini 系',   accent:'#7A5AF8', tint:'#F2EFFF', tint2:'#E7E1FD', sub:'#4A3F72', canvas:'#D6D0EA', deep:'#4530A8' },
  { id:'sky',    name:'天青', brand:'Kimi 系',     accent:'#2AA5E8', tint:'#EBF7FE', tint2:'#DCF0FC', sub:'#2A5068', canvas:'#CFDFE8', deep:'#12628C' },
  { id:'pine',   name:'松绿', brand:'豆包 / 千问系', accent:'#10A37F', tint:'#EDF8F4', tint2:'#DCF1E9', sub:'#2A4F44', canvas:'#CFE0DA', deep:'#0A6449' }
];

// 极简符号库：纯几何路径，不含任何第三方素材
function sym(kind, color, size) {
  let b = '';
  if (kind === 'whale') {
    b = `<path d="M3.2 17.4 C5.4 9.2 13.2 5.4 20.2 7.6 C16.8 9.6 15.4 12.6 15.4 16.2 C13.4 13.2 8.8 13.0 6.6 17.4 Z" fill="${color}"/>`;
  } else if (kind === 'whale2') {
    b = `<path d="M12 20.6 C6.2 20.6 2.6 16.2 2.6 12.2 C2.6 11.6 3.2 11.3 3.7 11.6
                   C5.3 12.7 7.4 13.2 9.4 12.6 C8.4 10.4 8.8 7.6 10.8 6.0 C11.3 5.6 12.0 6.0 11.9 6.6
                   C11.6 8.6 12.4 10.6 14.1 11.6 C15.9 12.7 17.4 14.3 18.0 16.6 C16.4 19.4 14.3 20.6 12 20.6 Z" fill="${color}"/>`;
  } else if (kind === 'hair') {
    b = `<path d="M12 3.4 C7.0 3.4 4.3 7.2 4.3 11.8 C4.3 14.0 5.1 16.2 6.5 17.8
                   C6.1 15.7 6.5 14.2 7.6 13.3 C7.4 15.2 8.0 16.8 9.1 17.7
                   C9.7 15.6 10.7 14.3 12 14.1 C13.3 14.3 14.3 15.6 14.9 17.7
                   C16.0 16.8 16.6 15.2 16.4 13.3 C17.5 14.2 17.9 15.7 17.5 17.8
                   C18.9 16.2 19.7 14.0 19.7 11.8 C19.7 7.2 17.0 3.4 12 3.4 Z" fill="${color}"/>`;
  } else if (kind === 'spark') {
    b = `<path d="M12 2.8 C12.9 8.3 15.7 11.1 21.2 12 C15.7 12.9 12.9 15.7 12 21.2 C11.1 15.7 8.3 12.9 2.8 12 C8.3 11.1 11.1 8.3 12 2.8 Z" fill="${color}"/>`;
  } else if (kind === 'star') {
    b = `<path d="M12 3.0 L14.4 9.0 L20.9 9.4 L15.8 13.6 L17.4 19.9 L12 16.4 L6.6 19.9 L8.2 13.6 L3.1 9.4 L9.6 9.0 Z" fill="${color}"/>`;
  } else if (kind === 'moon') {
    b = `<path d="M15.9 3.2 A9.1 9.1 0 1 0 15.9 20.8 A7.3 7.3 0 0 1 15.9 3.2 Z" fill="${color}"/>`;
  } else if (kind === 'dot') {
    b = `<circle cx="12" cy="12" r="7.0" fill="${color}"/>`;
  } else if (kind === 'leaf') {
    b = `<path d="M20.4 3.6 C11.2 3.6 5.2 8.2 5.2 15.4 C5.2 17.0 5.6 18.4 6.3 19.6
                   C7.3 19.8 8.3 19.9 9.3 19.9 C16.5 19.9 20.4 13.0 20.4 3.6 Z
                   M6.0 19.2 C8.4 14.6 12.0 10.8 16.4 8.2" fill="${color}"/>`;
  } else if (kind === 'chibi') {
    b = `<circle cx="12" cy="12.4" r="8.4" fill="${color}"/>
         <circle cx="9.3" cy="11.8" r="1.1" fill="#fff"/>
         <circle cx="14.7" cy="11.8" r="1.1" fill="#fff"/>
         <ellipse cx="6.9" cy="14.5" rx="1.4" ry="0.9" fill="#fff" opacity=".5"/>
         <ellipse cx="17.1" cy="14.5" rx="1.4" ry="0.9" fill="#fff" opacity=".5"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">${b}</svg>`;
}

// ---------- 生成六套键盘 ----------
function kbHTML(t) {
  const r1 = 'qwertyuiop'.split('').map(c=>`<div class="k" style="background:#FFF">${c}</div>`).join('');
  const r2 = 'asdfghjkl'.split('').map(c=>`<div class="k" style="background:#FFF">${c}</div>`).join('');
  const r3 = `<div class="k fn" style="background:${t.tint2};flex:0 0 50px">⇧</div>`
           + 'zxcvbnm'.split('').map(c=>`<div class="k" style="background:#FFF">${c}</div>`).join('')
           + `<div class="k fn" style="background:${t.tint2};flex:0 0 50px">⌫</div>`;
  const r4 = `<div class="k fn" style="background:${t.tint2};flex:0 0 50px">123</div>`
           + `<div class="k fn" style="background:${t.tint2};flex:0 0 50px">🌐</div>`
           + `<div class="k fn" style="background:#FFF;flex:1">空格</div>`
           + `<div class="k fn" style="background:${t.accent};color:#FFF;flex:0 0 46px">⏎</div>`
           + `<div class="corner">${sym('whale', t.accent, 22)}</div>`;

  return `
  <div class="card">
    <div class="lab"><b>${t.name}</b><span>${t.brand}</span>
      <span class="sw"><i style="background:${t.accent}"></i><i style="background:${t.tint};border:1px solid ${t.tint2}"></i></span></div>
    <div class="kb" style="background:${t.canvas}">
      <div class="cand" style="background:#FFF">
        <div class="ch" style="color:${t.deep}">nihao</div>
        <div class="c1" style="background:${t.accent};color:#FFF">你好</div>
        <div class="cn" style="color:${t.sub}">拟好</div>
        <div class="cn" style="color:${t.sub}">你</div>
      </div>
      <div class="aibar" style="background:${t.tint}">
        <div class="pill" style="background:${t.accent};color:#FFF">润色</div>
        <div class="pill" style="background:${t.tint2};color:${t.deep}">扩写</div>
        <div class="pill" style="background:${t.tint2};color:${t.deep}">翻译</div>
        <div class="pill" style="background:${t.tint2};color:${t.deep}">回复</div>
        <div class="knob" style="background:${t.accent}">${sym('spark','#FFF',20)}</div>
      </div>
      <div class="keys">
        <div class="row">${r1}</div>
        <div class="row">${r2}</div>
        <div class="row">${r3}</div>
        <div class="row">${r4}</div>
      </div>
    </div>
  </div>`;
}

document.getElementById('grid').innerHTML = THEMES.map(kbHTML).join('');

// ---------- 三档精细度 ----------
const TIERS = [
  { m:'whale', n:'A · 极简符号', d:'纯几何：鲸尾弧线。没有脸、没有发型、没有衣服。零版权风险。', s:'22 pt 主尺寸<br>16 pt 紧凑', c:'#4D6BFE' },
  { m:'hair',  n:'B · 剪影',     d:'有头部轮廓和发梢走势，能看出「这个角色是谁」，但不画五官。仍需原创。', s:'22 pt 主尺寸<br>16 pt 紧凑', c:'#D97757' },
  { m:'chibi', n:'C · Q 版小人', d:'带眼睛和腮红的最小角色。最像「角落里有小家伙」，必须完全原创绘制。', s:'22 pt 主尺寸<br>16 pt 紧凑', c:'#7A5AF8' }
];
document.getElementById('tiers').innerHTML = TIERS.map(t => `
  <div class="tbox">
    <div class="tname">${t.n}</div>
    <div class="tdesc">${t.d}</div>
    <div class="tdemo">
      <div class="box">${sym(t.m, t.c, 34)}</div>
      <div class="sz">${t.s}</div>
    </div>
  </div>`).join('');

// ---------- 符号一览 ----------
const SYMS = [
  ['whale','鲸尾 A'], ['whale2','鲸尾 B'], ['spark','四角星'], ['star','五角星'],
  ['moon','月牙'], ['leaf','叶子'], ['dot','圆点'], ['chibi','Q版']
];
document.getElementById('syms').innerHTML = SYMS.map(([k,n]) => `
  <div class="sym">${sym(k,'#4D6BFE',26)}<span class="lbl">${n}</span></div>`).join('');
</script>
</body>
</html>
