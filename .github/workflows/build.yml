name: Build Unsigned IPA

# ---------------------------------------------------------------------------
# 墨语（Moyu）iOS 输入法 · 云端构建未签名 IPA
#
# 为什么需要这个 workflow
# ----------------------
# 本项目作者只有 Windows 电脑，没有 Mac、没有 Apple Developer Program（免费 Apple ID）。
# iOS 应用只能在 macOS 上编译，所以用 GitHub Actions 的 macOS runner 编译出**未签名**
# 的 IPA（AIKeyboard-unsigned.ipa），再在 Windows 上用 Sideloadly / AltStore 之类工具
# 用自己的免费 Apple ID 重签名装到 iPhone 上（签名 7 天有效，到期重装即可）。
#
# 用法
# ----
#   1. 把仓库推到 GitHub（public 或 private 均可，免费额度足够）。
#   2. Actions 页面 → 左侧 "Build Unsigned IPA" → "Run workflow" 手动触发；
#      或直接 push 到 main 分支自动触发。
#   3. 构建完成后在该次运行底部 Artifacts 里下载 AIKeyboard-unsigned.ipa（保留 7 天）。
#   4. Windows 侧：装 iTunes（微软商店版即可）→ Sideloadly 选 ipa + 输入 Apple ID →
#      生成 7 天有效期的描述文件 → 手机信任开发者 → 添加键盘。
#      详见 docs/04-安装与续签指南.md 与 docs/ios/README-构建.md。
#
# 重要约定
# --------
# * 必须用 `-project + -scheme`，**不要**用 `-workspace`：本仓库没有 .xcworkspace
#   工作区文件（单工程、零第三方依赖，不需要 workspace）。
# * CODE_SIGNING_ALLOWED=NO 产出的是未签名包；PlugIns 里的 .appex 必须保留，
#   否则装到手机上键盘根本不会出现在"设置-通用-键盘"里（这是最常见的坑）。
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "构建配置（默认 Release）"
        required: false
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "scripts/gen_xcodeproj.py"
      - "scripts/validate_project.py"
      - ".github/workflows/build.yml"

# 同一分支只保留最新一次运行，避免多个 macOS 任务排队烧时长
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 统一时区与编码，日志里的中文不要乱码
  TZ: Asia/Shanghai
  LANG: en_US.UTF-8
  PRODUCT_SCHEME: AIKeyboard
  XCODEPROJ: ios/AIKeyboard.xcodeproj
  BUILD_DIR: build
  CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
  # 版本号：Marketing 版本手工维护（改这里），Build 号用 CI 的 run 序号自动递增。
  # 之前所有构建都写死 `1.0.0 build 1`，导致装到手机上根本无法区分是哪一版 ——
  # 用户反馈「好像没更新」，我在设备侧和包里都拿不到版本证据。现在改为：
  #   设置 › 通用 › iPhone 储存空间 › 墨语 → 版本 1.5.0，构建号 = run 序号
  MARKETING_VERSION: 2.1.0
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA (macOS)
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      # ---------------------------------------------------------------------
      # 0) 取出源码
      # ---------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---------------------------------------------------------------------
      # 1) 环境自检：Xcode 版本 / Python 版本
      # ---------------------------------------------------------------------
      - name: Show Xcode version
        run: |
          set -euo pipefail
          xcodebuild -version
          echo "----"
          xcode-select -p
          echo "----"
          sw_vers
          echo "----"
          python3 --version

      # ---------------------------------------------------------------------
      # 2) 预检：键盘扩展必须真的有源码，否则装到手机上键盘不出现
      #    （并行开发阶段 ios/AIKeyboardExtension/ 可能是空的，这里提前拦住，
      #      给出比 xcodebuild 莫名其妙的链接错误清楚得多的提示）
      # ---------------------------------------------------------------------
      - name: Preflight - extension sources exist
        run: |
          set -euo pipefail
          ext_dir="ios/AIKeyboardExtension"
          if [ ! -d "$ext_dir" ]; then
            echo "::error::目录 $ext_dir 不存在。键盘扩展没有源码，无法构建可用的键盘。"
            exit 1
          fi
          count=$(find "$ext_dir" -name '*.swift' -type f | wc -l | tr -d ' ')
          echo "ios/AIKeyboardExtension 下的 .swift 文件数：$count"
          if [ "$count" -eq 0 ]; then
            echo "::error::$ext_dir 下没有任何 .swift 文件。请先落盘 KeyboardViewController，再重跑构建。"
            exit 1
          fi
          if ! grep -rqE 'class[[:space:]]+KeyboardViewController\b' "$ext_dir"; then
            echo "::error::$ext_dir 里没有找到 KeyboardViewController 类；Extension-Info.plist 的 NSExtensionPrincipalClass 指向它，缺了会启动即崩溃。"
            exit 1
          fi
          echo "OK：键盘扩展源码齐全。"

      - name: Preflight - shared sources exist
        run: |
          set -euo pipefail
          count=$(find ios/Shared -name '*.swift' -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "ios/Shared 下的 .swift 文件数：$count"
          if [ "$count" -eq 0 ]; then
            echo "::error::ios/Shared 下没有任何 .swift 文件，两个 target 都会编译失败。"
            exit 1
          fi

      # 词库布局预检：iOS 27 的 installd / IXPlaceholder 会拒绝 app bundle 根目录下存在名为
      # Resources 的目录（真机实测：即使空目录也会让安装失败，报 IXErrorDomain Code=13
      # Missing bundle ID）。所以词库必须在 ios/Shared/dict/，不能是 ios/Shared/Resources/dict/。
      - name: Preflight - dictionary layout
        run: |
          set -euo pipefail
          if [ -d ios/Shared/Resources ]; then
            echo "::error::发现 ios/Shared/Resources/ 目录。词库必须放在 ios/Shared/dict/（folder reference 会把文件夹名原样复制到 bundle 根，叫 Resources 会让 iOS 27 installd 拒绝安装）。"
            ls -la ios/Shared/Resources || true
            exit 1
          fi
          if [ ! -d ios/Shared/dict ]; then
            echo "::error::ios/Shared/dict/ 不存在 —— 词库没落盘，拼音候选只能用内置极小词表。"
            exit 1
          fi
          for f in base_dict.tsv phrases.tsv dict_meta.json; do
            if [ ! -f "ios/Shared/dict/$f" ]; then
              echo "::error::ios/Shared/dict/$f 缺失"
              exit 1
            fi
            echo "OK: ios/Shared/dict/$f ($(wc -c < "ios/Shared/dict/$f" | tr -d ' ') bytes)"
          done
          echo "OK：词库目录布局正确（ios/Shared/dict/，无 ios/Shared/Resources/）。"

      # macOS 是唯一能真正跑 bash 的环境（开发机是 Windows，没有 bash），
      # 所以在这里对壳脚本做语法检查，保证 finalize.sh 交到用户手上时是能跑的。
      - name: Preflight - shell script syntax
        run: |
          set -euo pipefail
          if [ -f scripts/finalize.sh ]; then
            bash -n scripts/finalize.sh
            echo "OK：scripts/finalize.sh 语法通过（bash -n）。"
          else
            echo "::warning::scripts/finalize.sh 不存在（跳过语法检查）。"
          fi

      # ---------------------------------------------------------------------
      # 3) 按磁盘上的真实文件重新生成 project.pbxproj
      #    gen_xcodeproj.py 是确定性生成器（UUID = 路径哈希），所以：
      #      * 谁新加了 .swift 忘了重跑脚本，CI 会自动补上；
      #      * 生成结果与仓库里提交的 pbxproj 应当一致，否则说明有人手改了 pbxproj。
      # ---------------------------------------------------------------------
      - name: Regenerate Xcode project from source tree
        run: |
          set -euo pipefail
          python3 scripts/gen_xcodeproj.py
          echo "---- 生成后与仓库版本的差异（正常应为空）----"
          git --no-pager diff --stat -- ios/AIKeyboard.xcodeproj || true
          git --no-pager diff -- ios/AIKeyboard.xcodeproj | head -n 200 || true

      - name: Validate generated project structure
        run: |
          set -euo pipefail
          python3 scripts/validate_project.py

      # ---------------------------------------------------------------------
      # 3.5) pbxproj 词法校验（OpenStep plist）
      #
      # 这道闸门是 CI run #1 失败后补上的。当时 validate_project.py 86 项全过，
      # 但 xcodebuild 连 `-list` 都跑不到，报：
      #     Old-style plist parser: missing semicolon in dictionary on line 251
      # 根因是 KeyboardViewModel+AI.swift 这类带 `+` 的文件名，在 pbxproj 里
      # 必须加引号（OpenStep plist 的裸字符串只允许 A-Z a-z 0-9 . _ $ / : -）。
      # 结构校验查不出这个，只有词法校验能查。
      # ---------------------------------------------------------------------
      - name: Validate pbxproj OpenStep plist syntax
        run: |
          set -euo pipefail
          python3 scripts/lead/pbxproj_plist_check.py

      # ---------------------------------------------------------------------
      # 4) 列出 scheme，确认 AIKeyboard 被 Xcode 识别
      # ---------------------------------------------------------------------
      - name: List schemes
        run: |
          set -euo pipefail
          mkdir -p "${BUILD_DIR}"
          # 先落盘再 grep：避免 `set -o pipefail` 下 grep -q 提前退出导致
          # xcodebuild 收到 SIGPIPE、整个管道返回 141 的假失败。
          xcodebuild -list -project "${XCODEPROJ}" > "${BUILD_DIR}/schemes.txt"
          cat "${BUILD_DIR}/schemes.txt"
          echo "----"
          if grep -q "^[[:space:]]*${PRODUCT_SCHEME}$" "${BUILD_DIR}/schemes.txt"; then
            echo "OK：找到 scheme ${PRODUCT_SCHEME}"
          else
            echo "::error::xcodebuild -list 里没有 scheme ${PRODUCT_SCHEME}；请检查 ios/AIKeyboard.xcodeproj/xcshareddata/xcschemes/"
            exit 1
          fi

      # ---------------------------------------------------------------------
      # 5) 归档（关闭一切签名，产未签名 .xcarchive）
      #    注意：必须用 -project + -scheme，不能用 -workspace（没有 workspace 文件）
      # ---------------------------------------------------------------------
      # ---------------------------------------------------------------------
      # 5) 归档（关闭一切签名，产未签名 .xcarchive）
      #
      # 为什么这里要容忍 archive 的退出码：
      #   CI run #4 实测，两个 target 都编译、链接成功，.app / .appex 都已完整生成，
      #   只有最后一步 ValidateEmbeddedBinary 报
      #       error: Couldn't load Info dictionary for <.../AIKeyboard.app/PlugIns/AIKeyboardExtension.appex>
      #   这个校验步骤是给「已签名」的包做签名侧一致性检查的（读代码签名里的 Info dict），
      #   而本 workflow 是刻意不签名的（CODE_SIGNING_ALLOWED=NO），它自然读不到 —— 属已知误报。
      #
      #   所以：archive 失败时，只要 .app 目录本身是完整的（含 PlugIns/*.appex 与
      #   appex/Info.plist），就直接采用它继续打包。真正的完整性由后面的
      #   「结构校验」和「Package unsigned IPA」两步把关，绝不放过残缺产物。
      # ---------------------------------------------------------------------
      - name: Build unsigned archive
        run: |
          set -uo pipefail
          mkdir -p "${BUILD_DIR}"
          ARCHIVE_LOG="${BUILD_DIR}/xcodebuild-archive.log"

          set +e
          xcodebuild \
            -project "${XCODEPROJ}" \
            -scheme "${PRODUCT_SCHEME}" \
            -configuration "${CONFIGURATION}" \
            -sdk iphoneos \
            -derivedDataPath "${BUILD_DIR}/dd" \
            -archivePath "${BUILD_DIR}/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            archive 2>&1 | tee "${ARCHIVE_LOG}"
          XCODEBUILD_STATUS=${PIPESTATUS[0]}
          set -e
          echo "xcodebuild archive 退出码 = ${XCODEBUILD_STATUS}"

          APP_PATH="${BUILD_DIR}/App.xcarchive/Products/Applications/AIKeyboard.app"
          INSTALL_LOC="${BUILD_DIR}/dd/Build/Intermediates.noindex/ArchiveIntermediates/AIKeyboard/InstallationBuildProductsLocation/Applications/AIKeyboard.app"

          # ---- 情形 A：正常成功 ----
          if [ "${XCODEBUILD_STATUS}" -eq 0 ] && [ -d "${APP_PATH}" ]; then
            echo "OK：archive 成功，产物在 ${APP_PATH}"
          fi

          # ---- 情形 B：archive 只在 ValidateEmbeddedBinary 失败，但产物完整 ----
          if [ ! -d "${APP_PATH}" ] && [ -d "${INSTALL_LOC}" ]; then
            echo "::warning::archive 未产出 .xcarchive（退出码 ${XCODEBUILD_STATUS}），但 .app 已完整生成；采用中间产物继续打包。"
            echo "---- archive 日志里的 error 行 ----"
            grep -E "error:|ARCHIVE FAILED|The following build commands failed" "${ARCHIVE_LOG}" | head -n 40 || true
            mkdir -p "${BUILD_DIR}/App.xcarchive/Products/Applications"
            cp -R "${INSTALL_LOC}" "${BUILD_DIR}/App.xcarchive/Products/Applications/"
            APP_PATH="${BUILD_DIR}/App.xcarchive/Products/Applications/AIKeyboard.app"
          fi

          # ---- 情形 C：没产物，也没中间产物 → 真失败，打全套诊断再退出 ----
          if [ ! -d "${APP_PATH}" ]; then
            echo "::error::archive 失败且找不到任何 .app 产物（退出码 ${XCODEBUILD_STATUS}）。"
            echo "---- archive 日志里的 error 行 ----"
            grep -E "error:|ARCHIVE FAILED" "${ARCHIVE_LOG}" | head -n 60 || true
            echo "---- Build 目录里的 .app / .appex ----"
            find "${BUILD_DIR}/dd" -maxdepth 9 \( -name "*.app" -o -name "*.appex" \) -print 2>/dev/null | head -n 40 || true
            exit 1
          fi

          # ---- 结构校验：appex 必须在 PlugIns 里，且 appex/Info.plist 必须可解析 ----
          APPEX="${APP_PATH}/PlugIns/AIKeyboardExtension.appex"
          echo "---- ${APP_PATH} 结构 ----"
          ls -la "${APP_PATH}" || true
          echo "---- PlugIns ----"
          ls -la "${APP_PATH}/PlugIns" 2>/dev/null || echo "（没有 PlugIns 目录）"
          if [ ! -d "${APPEX}" ]; then
            echo "::error::app 里没有 PlugIns/AIKeyboardExtension.appex —— 装到手机上键盘不会出现在键盘列表。"
            find "${BUILD_DIR}/dd" -maxdepth 9 -name "*.appex" -print 2>/dev/null | head -n 20 || true
            exit 1
          fi
          echo "---- appex 内容 ----"
          ls -la "${APPEX}" || true
          if [ ! -f "${APPEX}/Info.plist" ]; then
            echo "::error::appex 里没有 Info.plist（系统不会认这个扩展）。"
            exit 1
          fi
          echo "---- appex/Info.plist 关键键 ----"
          plutil -p "${APPEX}/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleExecutable|CFBundlePackageType|CFBundleShortVersionString|CFBundleVersion|NSExtensionPointIdentifier|NSExtensionPrincipalClass|RequestsOpenAccess' || true
          echo "OK：unsigned app 结构完整。"

      # ---------------------------------------------------------------------
      # 6) 打包成 IPA：Payload/AIKeyboard.app 必须包含 PlugIns/AIKeyboardExtension.appex
      # ---------------------------------------------------------------------
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="${BUILD_DIR}/App.xcarchive/Products/Applications/AIKeyboard.app"
          if [ ! -d "${APP_PATH}" ]; then
            echo "::error::归档里没有找到 AIKeyboard.app：${APP_PATH}"
            echo "---- 归档目录内容 ----"
            find "${BUILD_DIR}/App.xcarchive" -maxdepth 4 -print || true
            exit 1
          fi

          rm -rf "${BUILD_DIR}/Payload"
          mkdir -p "${BUILD_DIR}/Payload"
          cp -R "${APP_PATH}" "${BUILD_DIR}/Payload/"

          echo "---- Payload 结构 ----"
          ls -R "${BUILD_DIR}/Payload/AIKeyboard.app"

          # 关键校验：.appex 必须在 PlugIns 里
          APPEX="${BUILD_DIR}/Payload/AIKeyboard.app/PlugIns/AIKeyboardExtension.appex"
          if [ ! -d "${APPEX}" ]; then
            echo "::error::IPA 里缺少 PlugIns/AIKeyboardExtension.appex —— 装到手机上键盘不会出现在键盘列表里。"
            echo "常见原因：App target 的 \"Embed Foundation Extensions\" Copy Files 阶段丢了（dstSubfolderSpec = 13）。"
            exit 1
          fi
          if [ ! -f "${APPEX}/AIKeyboardExtension" ]; then
            echo "::error::${APPEX} 里没有可执行文件 AIKeyboardExtension。"
            ls -la "${APPEX}" || true
            exit 1
          fi
          echo "OK：PlugIns/AIKeyboardExtension.appex 及可执行文件都在。"

          # 关键校验：bundle 根下**不能**有 Resources/ 目录。
          # iOS 27 的 installd / IXPlaceholder 会拒绝这种包（真机实测：即使目录是空的也会让
          # 安装失败，报 IXErrorDomain Code=13 Missing bundle ID，很容易被误判成签名问题）。
          # 词库必须以 folder reference 的形式落到 bundle 根下、文件夹名叫 dict。
          if [ -e "${BUILD_DIR}/Payload/AIKeyboard.app/Resources" ]; then
            echo "::error::IPA 的 app bundle 根下出现了 Resources/ 目录 —— iOS 27 installd 会拒绝安装（IXErrorDomain Code=13）。"
            echo "词库应作为 folder reference 打包成 Payload/AIKeyboard.app/dict/，不能是 Resources/dict/。"
            mkdir -p "${BUILD_DIR}/ipa_check"
            find "${BUILD_DIR}/Payload/AIKeyboard.app/Resources" -maxdepth 2 -print | head -n 40 || true
            exit 1
          fi
          if [ -e "${APPEX}/Resources" ]; then
            echo "::error::appex 根下出现了 Resources/ 目录 —— 同样会让 installd 拒绝安装。"
            exit 1
          fi
          echo "OK：bundle 根下没有 Resources/ 目录（符合 iOS 27 installd 要求）。"

          # 词库必须真的进包：两个 bundle 都要有 dict/
          if [ ! -d "${BUILD_DIR}/Payload/AIKeyboard.app/dict" ]; then
            echo "::error::app bundle 里没有 dict/（词库没被打包，拼音候选会用内置极小词表）。"
            ls -la "${BUILD_DIR}/Payload/AIKeyboard.app" || true
            exit 1
          fi
          if [ ! -d "${APPEX}/dict" ]; then
            echo "::error::appex 里没有 dict/（键盘扩展读不到词库）。"
            ls -la "${APPEX}" || true
            exit 1
          fi
          echo "---- 词库文件 ----"
          ls -la "${BUILD_DIR}/Payload/AIKeyboard.app/dict" || true
          ls -la "${APPEX}/dict" || true

          # 校验扩展 Info.plist 里的键盘点标识（漏了它系统不认这个键盘）
          if command -v plutil >/dev/null 2>&1; then
            echo "---- Extension-Info.plist 关键键 ----"
            plutil -p "${APPEX}/Info.plist" | grep -E 'NSExtensionPointIdentifier|NSExtensionPrincipalClass|RequestsOpenAccess' || true
          fi

          # 用 ditto 保证符号链接/资源叉在压缩时不出问题
          ( cd "${BUILD_DIR}" && ditto -c -k --sequesterRsrc --keepParent Payload AIKeyboard-unsigned.ipa )

          echo "---- 产物 ----"
          ls -lh "${BUILD_DIR}/AIKeyboard-unsigned.ipa"
          echo "---- 产物大小校验 ----"
          size=$(stat -f%z "${BUILD_DIR}/AIKeyboard-unsigned.ipa")
          echo "bytes=${size}"
          if [ "${size}" -lt 100000 ]; then
            echo "::error::IPA 只有 ${size} 字节，明显不正常（可能没把 .app 打进去）。"
            exit 1
          fi

      - name: Verify IPA contents
        run: |
          set -euo pipefail
          echo "---- IPA 内文件清单（前 80 行）----"
          unzip -l "${BUILD_DIR}/AIKeyboard-unsigned.ipa" | head -n 80
          echo "---- 关键条目检查 ----"
          unzip -l "${BUILD_DIR}/AIKeyboard-unsigned.ipa" | grep -q 'Payload/AIKeyboard.app/PlugIns/AIKeyboardExtension.appex/' \
            || { echo "::error::IPA 内没有 PlugIns/AIKeyboardExtension.appex"; exit 1; }
          unzip -l "${BUILD_DIR}/AIKeyboard-unsigned.ipa" | grep -q 'Payload/AIKeyboard.app/AIKeyboard$' \
            || { echo "::error::IPA 内没有主程序 Payload/AIKeyboard.app/AIKeyboard"; exit 1; }
          unzip -l "${BUILD_DIR}/AIKeyboard-unsigned.ipa" | grep -q 'Payload/AIKeyboard.app/Info.plist' \
            || { echo "::error::IPA 内没有 Payload/AIKeyboard.app/Info.plist"; exit 1; }
          # 词库必须以 dict/ 落到两个 bundle 的根下（iOS 27 installd 拒绝 bundle 根下的 Resources/）
          unzip -l "${BUILD_DIR}/AIKeyboard-unsigned.ipa" | grep -q 'Payload/AIKeyboard.app/dict/base_dict.tsv' \
            || { echo "::error::IPA 内没有 Payload/AIKeyboard.app/dict/base_dict.tsv"; exit 1; }
          unzip -l "${BUILD_DIR}/AIKeyboard-unsigned.ipa" | grep -q 'Payload/AIKeyboard.app/PlugIns/AIKeyboardExtension.appex/dict/base_dict.tsv' \
            || { echo "::error::IPA 内 appex 缺少 dict/base_dict.tsv"; exit 1; }
          # 反向断言：绝不能出现 bundle 根下的 Resources/ 目录
          if unzip -l "${BUILD_DIR}/AIKeyboard-unsigned.ipa" | grep -qE 'Payload/AIKeyboard\.app/Resources/|Payload/AIKeyboard\.app/PlugIns/AIKeyboardExtension\.appex/Resources/'; then
            echo "::error::IPA 里出现了 bundle 根下的 Resources/ 目录 —— iOS 27 installd 会拒绝安装。"
            exit 1
          fi
          echo "OK：IPA 结构完整（词库在 dict/，无 Resources/ 目录）。"

      # ---------------------------------------------------------------------
      # 7) 上传产物（保留 7 天，与免费签名 7 天有效期一致）
      # ---------------------------------------------------------------------
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIKeyboard-unsigned-ipa
          path: build/AIKeyboard-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      # 构建失败时把 xcodebuild 日志也传上去，方便排查（没有 xcresult 时也能看）
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/dd/Logs/Build
          if-no-files-found: ignore
          retention-days: 7
